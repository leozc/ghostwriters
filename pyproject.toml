[project]
name = "ghostwriter"
version = "0.1.0"
description = "Autonomous blog post optimization via multi-persona evaluation"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.52.0",
    "fastapi>=0.110",
    "pydantic>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
