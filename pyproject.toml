[project]
name = "ghostwriter"
version = "0.1.0"
description = "Autonomous blog post optimization via multi-persona evaluation"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.55",
    "fastapi>=0.110",
    "pydantic>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostwriter"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "integration: hits real APIs; skipped by default in CI",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter; warn-only otherwise
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "B011",   # asserts in tests are fine
    "RUF059", # tuple unpack-and-discard is idiomatic in tests
]

[tool.mypy]
python_version = "3.10"
files = ["src/ghostwriter"]
strict = false
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["litellm.*"]
ignore_missing_imports = true
